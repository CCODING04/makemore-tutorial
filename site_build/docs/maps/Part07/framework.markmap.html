<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 7: Minimind 复现 - 知识脉络图</title>
<style>
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
#mindmap { width: 100vw; height: 100vh; }
.toolbar { position: fixed; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; }
.toolbar button { padding: 8px 16px; background: #18E299; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.toolbar button:hover { background: #0fa76e; }
.toolbar a { padding: 8px 16px; background: #f0f3f6; color: #1f2328; border: 1px solid #d0d7de; border-radius: 8px; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/index.html">返回首页</a>
  <button onclick="markmap.fit()">适应屏幕</button>
</div>
<svg id="mindmap"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15"></script>
<script>
const md = `# Part 7: Minimind 复现
## 01. BPE Tokenizer
- 为什么需要 subword
- BPE 算法原理
- 训练 6400 词表
- 压缩率对比
- chat 格式预告
## 02. 现代组件：RMSNorm 与 RoPE
- LayerNorm 回顾
- RMSNorm
- RoPE 旋转位置编码
- 权重绑定
## 03. GQA 与 FFN：SwiGLU、KV Cache、MoE
- MHA 回顾
- GQA/MQA
- KV Cache
- Flash Attention
- SwiGLU
## 04. 训练流水线：Pretrain → SFT → DPO
- 预训练技巧
- SFT + Loss Masking
- DPO
- 完整流水线与部署（章末挂三阶段验收）
## 05. 复现 minimind 毕业指南
- 课程脚本 ↔ 官方 trainer 对照
- 真实数据下载
- 四阶段超参
- 验收与成本；进阶实验：RoPE 外推四件套 + 迷你 RULER 长上下文评测 + MoE 负载均衡`;
(async function() {
  const { Transformer } = markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(md);
  const { Markmap } = markmap;
  const svg = document.getElementById('mindmap');
  const mm = Markmap.create(svg, {
    autoFit: true,
    duration: 300,
    maxWidth: 300,
    initialExpandLevel: 2,
  }, root);
  window.markmap = mm;
})();
</script>
</body>
</html>
