# lm-evaluation-harness 自定义 task：本课程知识 5 题（DPO/GRPO/LoRA/量化/RAG）
# 用法（相对路径以【运行 lm_eval 时的 cwd】为基准解析——须在 mytasks/ 目录下运行）：
#    cd courses/Part8_post_training/scripts/mytasks
#    lm_eval --model hf --model_args pretrained=Qwen/Qwen2.5-0.5B-Instruct \
#            --tasks course_quiz --include_path .
# 从其他目录跑的绝对路径版由 12_lm_eval_hands_on.py 运行时在临时目录生成（不改动本文件）。
task: course_quiz
dataset_path: json
dataset_kwargs:
  data_files:
    test: course_quiz.jsonl
test_split: test          # 不写这行，0.4.13 报 "must have valid or test docs"（实测坑）
output_type: multiple_choice
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: "{{answer}}"
doc_to_choice: "{{choices}}"
metric_list:
  - {metric: acc}
