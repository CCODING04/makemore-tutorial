<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0d0d0d">GPipe 时间线（p=4 段 × m=4 micro-batch）：灰格 = 气泡，占比 (p-1)/(m+p-1) = 3/7 ≈ 43%</text>
  <g font-size="12" font-family="ui-monospace,monospace">
    <text x="16" y="66" fill="#57606a">S0</text><text x="16" y="106" fill="#57606a">S1</text>
    <text x="16" y="146" fill="#57606a">S2</text><text x="16" y="186" fill="#57606a">S3</text>
  </g>
  <!-- S0: F F F F B B B B -->
  <g>
    <rect x="50" y="50" width="40" height="36" fill="#0969da"/><rect x="90" y="50" width="40" height="36" fill="#0969da"/>
    <rect x="130" y="50" width="40" height="36" fill="#0969da"/><rect x="170" y="50" width="40" height="36" fill="#0969da"/>
    <rect x="210" y="50" width="40" height="36" fill="#d0d7de"/><rect x="250" y="50" width="40" height="36" fill="#d0d7de"/>
    <rect x="290" y="50" width="40" height="36" fill="#d0d7de"/><rect x="330" y="50" width="40" height="36" fill="#d0d7de"/>
    <rect x="370" y="50" width="40" height="36" fill="#15803d"/><rect x="410" y="50" width="40" height="36" fill="#15803d"/>
    <rect x="450" y="50" width="40" height="36" fill="#15803d"/><rect x="490" y="50" width="40" height="36" fill="#15803d"/>
  </g>
  <!-- S1: idle F F F F B B B B idle -->
  <g>
    <rect x="50" y="90" width="40" height="36" fill="#d0d7de"/>
    <rect x="90" y="90" width="40" height="36" fill="#0969da"/><rect x="130" y="90" width="40" height="36" fill="#0969da"/>
    <rect x="170" y="90" width="40" height="36" fill="#0969da"/><rect x="210" y="90" width="40" height="36" fill="#0969da"/>
    <rect x="250" y="90" width="40" height="36" fill="#d0d7de"/><rect x="290" y="90" width="40" height="36" fill="#d0d7de"/>
    <rect x="330" y="90" width="40" height="36" fill="#d0d7de"/><rect x="370" y="90" width="40" height="36" fill="#d0d7de"/>
    <rect x="410" y="90" width="40" height="36" fill="#15803d"/><rect x="450" y="90" width="40" height="36" fill="#15803d"/>
    <rect x="490" y="90" width="40" height="36" fill="#15803d"/><rect x="530" y="90" width="40" height="36" fill="#15803d"/>
    <rect x="10" y="90" width="40" height="36" fill="#d0d7de"/>
  </g>
  <!-- S2 -->
  <g>
    <rect x="10" y="130" width="40" height="36" fill="#d0d7de"/><rect x="50" y="130" width="40" height="36" fill="#d0d7de"/>
    <rect x="90" y="130" width="40" height="36" fill="#0969da"/><rect x="130" y="130" width="40" height="36" fill="#0969da"/>
    <rect x="170" y="130" width="40" height="36" fill="#0969da"/><rect x="210" y="130" width="40" height="36" fill="#0969da"/>
    <rect x="250" y="130" width="40" height="36" fill="#d0d7de"/><rect x="290" y="130" width="40" height="36" fill="#d0d7de"/>
    <rect x="330" y="130" width="40" height="36" fill="#d0d7de"/><rect x="370" y="130" width="40" height="36" fill="#d0d7de"/>
    <rect x="410" y="130" width="40" height="36" fill="#d0d7de"/>
    <rect x="450" y="130" width="40" height="36" fill="#15803d"/><rect x="490" y="130" width="40" height="36" fill="#15803d"/>
    <rect x="530" y="130" width="40" height="36" fill="#15803d"/><rect x="570" y="130" width="40" height="36" fill="#15803d"/>
  </g>
  <!-- S3: idle idle idle idle F F F F B B B B -->
  <g>
    <rect x="10" y="170" width="40" height="36" fill="#d0d7de"/><rect x="50" y="170" width="40" height="36" fill="#d0d7de"/>
    <rect x="90" y="170" width="40" height="36" fill="#d0d7de"/><rect x="130" y="170" width="40" height="36" fill="#d0d7de"/>
    <rect x="170" y="170" width="40" height="36" fill="#0969da"/><rect x="210" y="170" width="40" height="36" fill="#0969da"/>
    <rect x="250" y="170" width="40" height="36" fill="#0969da"/><rect x="290" y="170" width="40" height="36" fill="#0969da"/>
    <rect x="330" y="170" width="40" height="36" fill="#d0d7de"/><rect x="370" y="170" width="40" height="36" fill="#d0d7de"/>
    <rect x="410" y="170" width="40" height="36" fill="#15803d"/><rect x="450" y="170" width="40" height="36" fill="#15803d"/>
    <rect x="490" y="170" width="40" height="36" fill="#15803d"/><rect x="530" y="170" width="40" height="36" fill="#15803d"/>
  </g>
  <g font-size="11" fill="#fff" font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="70" y="72">F</text><text x="110" y="72">F</text><text x="150" y="72">F</text><text x="190" y="72">F</text>
    <text x="390" y="192">F</text><text x="430" y="192">F</text><text x="470" y="192">F</text><text x="510" y="192">F</text>
    <text x="470" y="192">B</text><text x="510" y="192">B</text><text x="550" y="192">B</text><text x="590" y="192">B</text>
  </g>
  <text x="20" y="240" font-size="12.5" fill="#57606a">蓝 = 前向 F　绿 = 反向 B　灰 = 气泡（等下游）。1F1B 的改进：灰格期间改跑反向，激活显存 ∝p 而非 ∝m。</text>
  <text x="20" y="266" font-size="12.5" fill="#57606a">m 越大气泡越少：bubble = (p-1)/(m+p-1)。交互版见本节"🎛️ 交互演示"。</text>
</svg>
