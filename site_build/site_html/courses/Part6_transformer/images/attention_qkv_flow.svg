<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0d0d0d">Self-Attention：Q（在找什么）× K（我的标签）→ 权重 → 加权 V（内容）</text>
  <!-- 三行 -->
  <text x="20" y="80" font-size="14" fill="#d97706" font-weight="600">Q 查询</text>
  <text x="20" y="150" font-size="14" fill="#0e7490" font-weight="600">K 键</text>
  <text x="20" y="220" font-size="14" fill="#15803d" font-weight="600">V 值</text>
  <g font-size="12" text-anchor="middle">
    <rect x="90" y="60" width="80" height="26" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="130" y="77" fill="#7c4a03">⟨bos⟩</text>
    <rect x="200" y="60" width="80" height="26" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="240" y="77" fill="#7c4a03">the</text>
    <rect x="310" y="60" width="80" height="26" rx="5" fill="#fde68a" stroke="#b45309"/><text x="350" y="77" fill="#7c4a03">cat ★</text>
    <rect x="420" y="60" width="80" height="26" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="460" y="77" fill="#7c4a03">sat</text>
    <rect x="90" y="130" width="80" height="26" rx="5" fill="#e0f2fe" stroke="#0e7490"/><text x="130" y="147" fill="#0e7490">⟨bos⟩</text>
    <rect x="200" y="130" width="80" height="26" rx="5" fill="#e0f2fe" stroke="#0e7490"/><text x="240" y="147" fill="#0e7490">the</text>
    <rect x="310" y="130" width="80" height="26" rx="5" fill="#bae6fd" stroke="#0284c7"/><text x="350" y="147" fill="#0e7490">cat</text>
    <rect x="420" y="130" width="80" height="26" rx="5" fill="#e0f2fe" stroke="#0e7490"/><text x="460" y="147" fill="#0e7490">sat</text>
    <rect x="90" y="200" width="80" height="26" rx="5" fill="#dcfce7" stroke="#15803d"/><text x="130" y="217" fill="#15803d">内容</text>
    <rect x="200" y="200" width="80" height="26" rx="5" fill="#dcfce7" stroke="#15803d"/><text x="240" y="217" fill="#15803d">内容</text>
    <rect x="310" y="200" width="80" height="26" rx="5" fill="#bbf7d0" stroke="#15803d"/><text x="350" y="217" fill="#15803d">内容★</text>
    <rect x="420" y="200" width="80" height="26" rx="5" fill="#dcfce7" stroke="#15803d"/><text x="460" y="217" fill="#15803d">内容</text>
  </g>
  <!-- 对账连线（q=cat 为例） -->
  <g stroke="#0e7490" stroke-width="1.4" opacity="0.85">
    <line x1="350" y1="86" x2="130" y2="130"/><line x1="350" y1="86" x2="240" y2="130"/>
    <line x1="350" y1="86" x2="350" y2="130" stroke-width="3.2"/>
    <line x1="350" y1="86" x2="460" y2="130"/>
  </g>
  <text x="475" y="112" font-size="12" fill="#0e7490">w = 0.05 / 0.10 / 0.60 / 0.25</text>
  <text x="475" y="130" font-size="12" fill="#57606a">（行和 = 1.00，softmax）</text>
  <!-- V 加权 -->
  <g stroke="#15803d" stroke-width="1.4" opacity="0.8">
    <line x1="130" y1="226" x2="600" y2="250"/>
    <line x1="240" y1="226" x2="600" y2="250"/>
    <line x1="350" y1="226" x2="600" y2="250" stroke-width="3"/>
    <line x1="460" y1="226" x2="600" y2="250"/>
  </g>
  <rect x="600" y="238" width="150" height="26" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="608" y="255" font-size="12" fill="#15803d">新表示（带全文语境）</text>
  <text x="20" y="280" font-size="12.5" fill="#57606a">8 个 token 各当一次提问者 → 8×8 权重矩阵 → 每行独立 softmax。逐帧动态版见本节"🎬 动画演示"。</text>
</svg>
