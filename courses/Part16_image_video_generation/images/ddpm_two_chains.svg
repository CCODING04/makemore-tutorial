<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0d0d0d">DDPM 双链：前向加噪（训练的路）↔ 反向去噪（生成的路）</text>
  <!-- 前向链 -->
  <text x="20" y="70" font-size="14" fill="#b91c1c" font-weight="600">前向 q（固定，一步闭式）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="85" width="110" height="40" rx="8" fill="#dbeafe" stroke="#0969da"/><text x="85" y="103" fill="#0969da">x₀ 双月环</text>
    <rect x="210" y="85" width="110" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/><text x="265" y="103" fill="#4338ca">x₁ 轻噪</text>
    <rect x="390" y="85" width="110" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/><text x="445" y="103" fill="#4338ca">x₂</text>
    <text x="545" y="110" font-size="18" fill="#6b7280">…</text>
    <rect x="570" y="85" width="130" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="635" y="103" fill="#374151">x_T 纯噪声</text>
  </g>
  <g stroke="#b91c1c" stroke-width="1.6">
    <line x1="140" y1="105" x2="210" y2="105"/><line x1="320" y1="105" x2="390" y2="105"/><line x1="500" y1="105" x2="570" y2="105"/>
  </g>
  <polygon points="210,105 202,101 202,109" fill="#b91c1c"/><polygon points="390,105 382,101 382,109" fill="#b91c1c"/><polygon points="570,105 562,101 562,109" fill="#b91c1c"/>
  <text x="140" y="98" font-size="11" fill="#b91c1c">加 √β_t·ε</text>
  <text x="620" y="140" font-size="12" fill="#57606a">训练时: 网络从 x_t 认出 ε（MSE）</text>
  <!-- 反向链 -->
  <text x="20" y="200" font-size="14" fill="#15803d" font-weight="600">反向 p（学习，生成时用）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="215" width="110" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="85" y="233" fill="#374151">x_T 纯噪声</text>
    <rect x="210" y="215" width="110" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/><text x="265" y="233" fill="#4338ca">x_{T-1}</text>
    <rect x="390" y="215" width="110" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/><text x="445" y="233" fill="#4338ca">x_{T-2}</text>
    <text x="545" y="240" font-size="18" fill="#6b7280">…</text>
    <rect x="570" y="215" width="130" height="40" rx="8" fill="#dbeafe" stroke="#0969da"/><text x="635" y="233" fill="#0969da">x₀ 生成图</text>
  </g>
  <g stroke="#15803d" stroke-width="1.6">
    <line x1="570" y1="235" x2="500" y2="235"/><line x1="390" y1="235" x2="320" y2="235"/><line x1="210" y1="235" x2="140" y2="235"/>
  </g>
  <polygon points="140,235 148,231 148,239" fill="#15803d"/><polygon points="320,235 312,231 312,239" fill="#15803d"/><polygon points="500,235 492,231 492,239" fill="#15803d"/>
  <text x="215" y="228" font-size="11" fill="#15803d">ε̂ = model(x_t, t)，按均值/方差回退一步</text>
  <text x="20" y="300" font-size="12.5" fill="#57606a">闭环读法：训练学"去掉哪部分噪声"（前向已知 ε）→ 生成用学到的 ε̂ 一步步走回 x₀。逐帧动态版见本节"🎬 动画演示"。</text>
</svg>
