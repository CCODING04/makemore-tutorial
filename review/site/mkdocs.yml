# 课程站点配置（MkDocs Material）——由 tools/build_site.py 消费
site_name: makemore 中文教程（审计优化版）
site_description: 从零构建字符级语言模型到现代 LLM 实战（审计优化镜像渲染）
theme:
  name: material
  features: [navigation.tabs, navigation.search, content.code.copy]
  palette: [{media: "(prefers-color-scheme: light)"}, {media: "(prefers-color-scheme: dark)", scheme: slate}]
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - tables
  - admonition
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
