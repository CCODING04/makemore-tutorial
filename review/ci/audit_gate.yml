# 教材 CI 模板（合回仓库后放 .github/workflows/audit.yml）
# 门槛：LaTeX 排版 0 问题 / 链接 0 坏链 / 章末指引同步 / 作业 pytest 全绿
name: course-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest
      - name: LaTeX 排版机检
        run: python tools/check_latex.py courses  # 逐文件扫描版入口（见 check_links 同款合并视图）
      - name: 链接检查
        run: python tools/check_links.py
      - name: 章末指引同步校验
        run: python tools/check_assignment_refs.py
      - name: 作业回归
        run: pytest assignments/ -q
