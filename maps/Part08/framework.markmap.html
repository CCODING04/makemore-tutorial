<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 8: 后训练全流程 - 知识脉络图</title>
<style>
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
#mindmap { width: 100vw; height: 100vh; }
.toolbar { position: fixed; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; }
.toolbar button { padding: 8px 16px; background: #18E299; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.toolbar button:hover { background: #0fa76e; }
.toolbar a { padding: 8px 16px; background: #f0f3f6; color: #1f2328; border: 1px solid #d0d7de; border-radius: 8px; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/index.html">返回首页</a>
  <button onclick="markmap.fit()">适应屏幕</button>
</div>
<svg id="mindmap"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15"></script>
<script>
const md = `# Part 8: 后训练全流程
## 01. GPT-2 与预训练
- 经典 GPT-2 架构（LayerNorm + learned PE + MHA + ReLU）
- 预训练流水线
## 02. SFT 与 Chat Template
- 监督微调
- Chat Template
- Prompt Masking
## 03. 奖励模型与对齐算法
- Bradley-Terry 奖励模型
- DPO/ORPO/KTO 三种对齐
## 04. 强化学习：PPO 与 GRPO
- PPO（GAE + Clipped Surrogate）
- GRPO（Critic-Free RL）
## 05. 评估与推理部署
- GSM8K 评估
- 全阶段对比
- 交互式 Chat
## 06. 推理与服务
- 量化 int8/int4（GPTQ/AWQ）
- KV 显存与 KIVI
- PagedAttention
- 连续批处理
- 投机解码
## 07. 评估学
- 规则/人工/LLM-judge 三范式
- lm-eval-harness（实操 + 自定义 task）
- HELM
- benchmark 污染（GSM1k）
- ppl 陷阱；**幻觉与安全**（语义熵/SelfCheckGPT
## 08. LoRA 与分类微调
- 从零写 LoRA（低秩分解注入）
- 参数量/显存对比
- 分类微调回顾
## 09. 推理模型与 test-time compute
- R1 四阶段管线
- cold start SFT → 推理 RL → self-consistency`;
(async function() {
  const { Transformer } = markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(md);
  const { Markmap } = markmap;
  const svg = document.getElementById('mindmap');
  const mm = Markmap.create(svg, {
    autoFit: true,
    duration: 300,
    maxWidth: 300,
    initialExpandLevel: 2,
  }, root);
  window.markmap = mm;
})();
</script>
</body>
</html>
